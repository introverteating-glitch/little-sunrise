 tired:{k:["tired","exhausted","drained","burn","sleepy","no energy","累","攰","疲倦","好殘","冇力"],label:["Tired","疲倦"],m:[["Tired means you've been showing up. That counts.","累，代表你一直有努力堅持，這很了不起。"],["Your battery isn't broken — it's asking for a recharge.","你不是壞掉了，只是電量低，需要充充電。"],["Rest isn't quitting. It's refuelling for the good parts ahead.","休息不是放棄，是為之後的美好加油。"],["You've carried a lot today. Put a little of it down.","今天你背負了很多，放下一點點吧。"]],s:["Drink some water and close your eyes for 2 minutes.","喝一杯水，閉上眼睛休息兩分鐘。"]},
